<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night City Archive</title>
  <meta name="description" content="Archivio della campagna di Cyberpunk RED: NPC, fazioni, luoghi e tracce musicali.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=70">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307070b'/><path d='M6 26 L16 4 L26 26 Z' fill='none' stroke='%23ff2a3d' stroke-width='3'/><circle cx='16' cy='19' r='3' fill='%2300f0ff'/></svg>">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" data-action="menu-toggle" title="Menu: tutte le sezioni" aria-label="Apri il menu" aria-expanded="false" aria-controls="side-menu">☰</button>
    <a class="brand" href="#/home">
      <span class="brand-mark">▲</span>
      <span class="brand-text glitch" id="brand-title" data-text="NIGHT CITY ARCHIVE">NIGHT CITY ARCHIVE</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/database" data-route="database">Database</a>
      <a href="#/diario" data-route="diario">Diario</a>
      <a href="#/calendario" data-route="calendario">Calendario</a>
      <a href="#/appunti" data-route="appunti">Appunti</a>
      <a href="#/tracce" data-route="tracce">Tracce</a>
      <a href="#/party" data-route="party">Party</a>
      <a href="#/mappa" data-route="mappa">Mappa</a>
      <a href="#/net" data-route="net">NET</a>
      <a href="#/hq" data-route="hq">HQ</a>
      <a href="#/glossario" data-route="glossario">Night Market</a>
      <a href="#/gm" data-route="gm" id="nav-gm" class="nav-gm" hidden>GM</a>
    </nav>
    <div class="top-actions">
      <span class="mode-pill" id="mode-pill" title="Modalità di salvataggio">…</span>
      <button class="icon-btn dice-btn" data-action="dice-toggle" title="Dice log: dadi e chat" aria-label="Dadi">⬢</button>
      <button class="icon-btn" data-action="settings" title="Impostazioni, accesso e backup" aria-label="Impostazioni">⚙</button>
    </div>
  </header>

  <!-- menu laterale: tutte le sezioni, sempre raggiungibili anche su schermi stretti -->
  <div class="side-backdrop" id="side-backdrop" data-action="menu-close" hidden></div>
  <aside class="side-menu" id="side-menu" aria-label="Menu delle sezioni" hidden>
    <div class="side-head">
      <span class="brand-mark">▲</span><span class="side-title">// NAVIGAZIONE</span>
      <button class="x" data-action="menu-close" aria-label="Chiudi il menu">×</button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
    <div class="side-foot">
      <button class="btn ghost small yellow" data-action="dice-open">⬢ Dice log</button>
      <button class="btn ghost small cyan" data-action="settings">⚙ Impostazioni</button>
    </div>
  </aside>

  <main id="app" class="app" aria-live="polite">
    <div class="boot">// BOOTING NEURAL LINK…</div>
  </main>

  <footer class="footer">
    <span>// archivio di campagna · uso personale non commerciale</span>
    <span id="footer-status"></span>
  </footer>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <!-- cambia ?v= quando aggiorni i file, così i browser scaricano la versione nuova -->
  <script src="js/config.js?v=70"></script>
  <script src="js/store.js?v=70"></script>
  <script src="js/dice.js?v=70"></script>
  <script src="js/net.js?v=70"></script>
  <script src="js/roles.js?v=70"></script>
  <script src="js/cyberware.js?v=70"></script>
  <script src="js/market.js?v=70"></script>
  <script src="js/hq.js?v=70"></script>
  <!-- interfaccia: un file per sezione, in quest'ordine (condividono le costanti) -->
  <script src="js/ui/core.js?v=70"></script>
  <script src="js/ui/cyber.js?v=70"></script>
  <script src="js/ui/sheet.js?v=70"></script>
  <script src="js/ui/roles.js?v=70"></script>
  <script src="js/ui/catalog.js?v=70"></script>
  <script src="js/ui/market.js?v=70"></script>
  <script src="js/ui/hq.js?v=70"></script>
  <script src="js/ui/ip.js?v=70"></script>
  <script src="js/ui/bonus.js?v=70"></script>
  <script src="js/ui/life.js?v=70"></script>
  <script src="js/ui/vehicles.js?v=70"></script>
  <script src="js/ui/combat.js?v=70"></script>
  <script src="js/ui/rules.js?v=70"></script>
  <script src="js/ui/arms.js?v=70"></script>
  <script src="js/ui/deck.js?v=70"></script>
  <script src="js/ui/dicelog.js?v=70"></script>
  <script src="js/ui/records.js?v=70"></script>
  <script src="js/ui/calendar.js?v=70"></script>
  <script src="js/ui/notes.js?v=70"></script>
  <script src="js/ui/diary.js?v=70"></script>
  <script src="js/ui/tracks.js?v=70"></script>
  <script src="js/ui/party.js?v=70"></script>
  <script src="js/ui/enemies.js?v=70"></script>
  <script src="js/ui/gm.js?v=70"></script>
  <script src="js/ui/net.js?v=70"></script>
  <script src="js/ui/map.js?v=70"></script>
  <script src="js/ui/draw.js?v=70"></script>
  <script src="js/ui/settings.js?v=70"></script>
  <script src="js/ui/events.js?v=70"></script>
  <script src="js/ui/boot.js?v=70"></script>
</body>
</html>
